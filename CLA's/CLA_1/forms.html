<!DOCTYPE html>
<html>

<head>
    <title>Student Registration Form</title>
</head>

<body>

    <h2 align="center"><b>Student Registration Form</b></h2>
    <h3 align="center"><i>Vignan University</i></h3>

    <form>

        <table border="1" cellpadding="10" cellspacing="0" align="center">

            <tr>
                <th colspan="2">Fill Your Details Carefully</th>
            </tr>

            <!-- Text Input -->
            <tr>
                <td><label for="name">Name:</label></td>
                <td>
                    <input type="text" id="name" name="name">
                </td>
            </tr>

            <!-- Number Input -->
            <tr>
                <td><label for="age">Age:</label></td>
                <td>
                    <input type="number" id="age" name="age">
                </td>
            </tr>

            <!-- Radio Button -->
            <tr>
                <td>Gender:</td>
                <td>
                    <input type="radio" name="gender" value="male"> Male
                    <input type="radio" name="gender" value="female"> Female
                    <input type="radio" name="gender" value="other"> Other
                </td>
            </tr>

            <!-- Date -->
            <tr>
                <td><label for="dob">Date of Birth:</label></td>
                <td>
                    <input type="date" id="dob" name="dob">
                </td>
            </tr>

            <!-- Select and Option -->
            <tr>
                <td><label for="branch">Select Branch:</label></td>
                <td>
                    <select id="branch" name="branch">
                        <option value="cse">CSE</option>
                        <option value="acse">ACSE</option>
                        <option value="ece">ECE</option>
                        <option value="eee">EEE</option>
                    </select>
                </td>
            </tr>

            <!-- Checkbox -->
            <tr>
                <td>Select Your Skills:</td>
                <td>
                    <input type="checkbox" name="skill" value="programming">
                    Programming

                    <input type="checkbox" name="skill" value="gaming">
                    Gaming

                    <input type="checkbox" name="skill" value="communication">
                    Communication
                </td>
            </tr>

            <!-- Email -->
            <tr>
                <td><label for="email">E-mail:</label></td>
                <td>
                    <input type="email" id="email" name="email">
                </td>
            </tr>

            <!-- Password -->
            <tr>
                <td><label for="password">Password:</label></td>
                <td>
                    <input type="password" id="password" name="password">
                </td>
            </tr>

            <!-- File Upload -->
            <tr>
                <td><label for="photo">Upload Photo:</label></td>
                <td>
                    <input type="file" id="photo" name="photo">
                </td>
            </tr>

            <!-- Textarea -->
            <tr>
                <td><label for="address">Address:</label></td>
                <td>
                    <textarea id="address" name="address"
                        rows="4" cols="30"></textarea>
                </td>
            </tr>

            <!-- Hidden -->
            <tr>
                <td>Hidden Field:</td>
                <td>
                    <input type="hidden" name="student_id" value="12345">
                    Hidden data is stored here
                </td>
            </tr>

            <!-- Submit, Reset, Button -->
            <tr>
                <td colspan="2" align="center">

                    <input type="submit" value="Submit">

                    <input type="reset" value="Reset">

                    <button type="button"
                        onclick="alert('Button Clicked')">
                        Click Me
                    </button>

                </td>
            </tr>

        </table>

    </form>

</body>

</html>
