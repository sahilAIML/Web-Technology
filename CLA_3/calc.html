<!DOCTYPE html>
<html>
<head>
    <title>Number Operations</title>
    <script>
        function getNumber() {
            return parseInt(document.getElementById("num").value);
        }

        // Factorial
        function factorial() {
            let n = getNumber();
            let fact = 1;

            if (n < 0) {
                document.getElementById("result").innerHTML = "Factorial is not defined for negative numbers.";
                return;
            }

            for (let i = 1; i <= n; i++) {
                fact *= i;
            }

            document.getElementById("result").innerHTML = "Factorial of " + n + " = " + fact;
        }

        // Fibonacci Series
        function fibonacci() {
            let n = getNumber();
            let a = 0, b = 1, series = "";

            while (a <= n) {
                series += a + " ";
                let temp = a + b;
                a = b;
                b = temp;
            }

            document.getElementById("result").innerHTML =
                "Fibonacci Series up to " + n + ":<br>" + series;
        }

        // Prime Numbers
        function prime() {
            let n = getNumber();
            let primes = "";

            for (let i = 2; i <= n; i++) {
                let isPrime = true;

                for (let j = 2; j <= Math.sqrt(i); j++) {
                    if (i % j == 0) {
                        isPrime = false;
                        break;
                    }
                }

                if (isPrime) {
                    primes += i + " ";
                }
            }

            document.getElementById("result").innerHTML =
                "Prime numbers up to " + n + ":<br>" + primes;
        }

        // Palindrome
        function palindrome() {
            let n = getNumber();
            let original = n;
            let rev = 0;

            while (n > 0) {
                let rem = n % 10;
                rev = rev * 10 + rem;
                n = Math.floor(n / 10);
            }

            if (original == rev)
                document.getElementById("result").innerHTML =
                    original + " is a Palindrome.";
            else
                document.getElementById("result").innerHTML =
                    original + " is Not a Palindrome.";
        }
    </script>
</head>

<body style="font-family: Arial; text-align:center; margin-top:50px;">

    <h2>Number Operations using JavaScript</h2>

    Enter a Number:
    <input type="number" id="num"><br><br>

    <button onclick="factorial()">Factorial</button>
    <button onclick="fibonacci()">Fibonacci</button>
    <button onclick="prime()">Prime</button>
    <button onclick="palindrome()">Palindrome</button>

    <h3 id="result"></h3>

</body>
</html>
