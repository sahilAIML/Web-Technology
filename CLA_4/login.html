<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Login</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <div class="container">

        <div class="card">

            <div class="icon">
                🔐
            </div>

            <h1>Welcome Back</h1>

            <p class="subtitle">
                Login to your account
            </p>


            <form action="index.jsp" method="post"
                  onsubmit="return validateLogin()">

                <!-- Email -->

                <div class="input-group">

                    <label for="email">
                        Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email"
                    >

                </div>


                <!-- Password -->

                <div class="input-group">

                    <label for="password">
                        Password
                    </label>

                    <div class="password-box">

                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Enter your password"
                        >

                        <button
                            type="button"
                            onclick="togglePassword()"
                            class="eye-button">

                            👁

                        </button>

                    </div>

                </div>


                <!-- Login -->

                <button
                    type="submit"
                    class="login-button">

                    Login

                </button>

            </form>

        </div>

    </div>


    <script src="script.js"></script>

</body>

</html>
