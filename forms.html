<!DOCTYPE html>
<html>
<head>
    <title>Company Website</title>
</head>

<!-- 3 horizontal sections -->
<frameset rows="20%,*,10%">

    <!-- TOP FRAME -->
    <frame srcdoc='
        <html>
        <body style="text-align:center; background-color:lightblue;">
            <h1>🏢 ABC Technologies</h1>
            <h3>Welcome to Our Company</h3>
        </body>
        </html>
    ' name="top">


    <!-- MIDDLE SECTION -->
    <frameset cols="20%,80%">

        <!-- LEFT FRAME -->
        <frame srcdoc='
            <html>
            <body style="background-color:lightgray;">
                <h2>Menu</h2>

                <a href="#home">Home</a><br><br>
                <a href="#products">Products</a><br><br>
                <a href="#services">Services</a><br><br>
                <a href="#branches">Branches</a><br><br>
                <a href="#about">About</a><br><br>
                <a href="#color">Color Palette</a><br><br>
            </body>
            </html>
        ' name="left">


        <!-- CENTER FRAME -->
        <frame srcdoc='
            <!DOCTYPE html>
            <html>
            <head>
                <style>

                    body {
                        font-family: Arial;
                        text-align: center;
                        transition: background-color 0.3s;
                    }

                    .color {
                        width: 70px;
                        height: 70px;
                        display: inline-block;
                        margin: 10px;
                        border: 2px solid black;
                        cursor: pointer;
                    }

                    .red { background-color:red; }
                    .blue { background-color:blue; }
                    .green { background-color:green; }
                    .yellow { background-color:yellow; }
                    .orange { background-color:orange; }
                    .purple { background-color:purple; }
                    .pink { background-color:pink; }

                </style>
            </head>

            <body>

                <h1>Welcome to ABC Technologies</h1>

                <p>Move your mouse over a color to change the background.</p>

                <div>

                    <div class="color red"
                         onmouseover="document.body.style.backgroundColor=&quot;red&quot;">
                    </div>

                    <div class="color blue"
                         onmouseover="document.body.style.backgroundColor=&quot;blue&quot;">
                    </div>

                    <div class="color green"
                         onmouseover="document.body.style.backgroundColor=&quot;green&quot;">
                    </div>

                    <div class="color yellow"
                         onmouseover="document.body.style.backgroundColor=&quot;yellow&quot;">
                    </div>

                    <div class="color orange"
                         onmouseover="document.body.style.backgroundColor=&quot;orange&quot;">
                    </div>

                    <div class="color purple"
                         onmouseover="document.body.style.backgroundColor=&quot;purple&quot;">
                    </div>

                    <div class="color pink"
                         onmouseover="document.body.style.backgroundColor=&quot;pink&quot;">
                    </div>

                </div>

                <hr>

                <h2>Our Products</h2>
                <p>Laptops | Mobile Apps | Web Applications | Software</p>

                <h2>Our Services</h2>
                <p>Web Development | App Development | AI/ML | Cloud Services</p>

                <h2>Our Branches</h2>
                <p>Hyderabad | Chennai | Bangalore | Delhi</p>

                <h2>About Us</h2>
                <p>ABC Technologies provides modern technology solutions.</p>

            </body>
            </html>
        ' name="center">

    </frameset>


    <!-- BOTTOM FRAME -->
    <frame srcdoc='
        <html>
        <body style="text-align:center; background-color:darkgray;">
            <p>© 2026 ABC Technologies. All Rights Reserved.</p>
        </body>
        </html>
    ' name="bottom">

</frameset>

</html>
