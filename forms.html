<!DOCTYPE html>
<html>
<head>
    <title>Company Website</title>
</head>

<frameset rows="20%,70%,10%">

    <!-- TOP FRAME -->
    <frame srcdoc="
        <html>
        <body style='text-align:center; background:lightblue;'>
            <h1>🏢 ABC Company</h1>
            <h3>Welcome to ABC Company</h3>
        </body>
        </html>
    ">

    <!-- MIDDLE: LEFT + CENTER -->
    <frameset cols="20%,80%">

        <!-- LEFT FRAME -->
        <frame srcdoc="
            <html>
            <body style='background:lightgray;'>
                <h3>MENU</h3>

                <a href='javascript:void(0)'>Home</a><br><br>
                <a href='javascript:void(0)'>Products</a><br><br>
                <a href='javascript:void(0)'>Services</a><br><br>
                <a href='javascript:void(0)'>Branches</a><br><br>
                <a href='javascript:void(0)'>About</a><br><br>

            </body>
            </html>
        ">

        <!-- CENTER FRAME -->
        <frame srcdoc="
            <html>
            <head>
                <style>
                    body {
                        text-align:center;
                        font-family:Arial;
                    }

                    .box {
                        width:60px;
                        height:60px;
                        display:inline-block;
                        margin:10px;
                        border:2px solid black;
                    }

                    .red { background:red; }
                    .blue { background:blue; }
                    .green { background:green; }
                    .yellow { background:yellow; }
                    .orange { background:orange; }
                    .purple { background:purple; }
                </style>
            </head>

            <body>

                <h1>Home</h1>

                <p>Welcome to ABC Company</p>

                <h2>Color Palette</h2>
                <p>Move your mouse over a color</p>

                <div class='box red'
                     onmouseover='document.body.style.backgroundColor=&quot;red&quot;'>
                </div>

                <div class='box blue'
                     onmouseover='document.body.style.backgroundColor=&quot;blue&quot;'>
                </div>

                <div class='box green'
                     onmouseover='document.body.style.backgroundColor=&quot;green&quot;'>
                </div>

                <div class='box yellow'
                     onmouseover='document.body.style.backgroundColor=&quot;yellow&quot;'>
                </div>

                <div class='box orange'
                     onmouseover='document.body.style.backgroundColor=&quot;orange&quot;'>
                </div>

                <div class='box purple'
                     onmouseover='document.body.style.backgroundColor=&quot;purple&quot;'>
                </div>

                <hr>

                <h2>Our Products</h2>
                <p>Laptops | Mobiles | Software</p>

                <h2>Our Services</h2>
                <p>Web Development | App Development</p>

            </body>
            </html>
        ">

    </frameset>

    <!-- BOTTOM FRAME -->
    <frame srcdoc="
        <html>
        <body style='text-align:center; background:gray;'>
            <p>© 2026 ABC Company. All Rights Reserved.</p>
        </body>
        </html>
    ">

</frameset>

</html>
